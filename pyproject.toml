[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.1.0"
description = "Car catalog laboratory project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.20.0"
]
optional-dependencies = { test = ["pytest>=8.0"] }

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]