[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "1.0.0"
description = "Car Catalog REST API Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "."

[tool.ruff.lint]
ignore = ["B008"]